name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  pull_request:
  schedule:
    # Weekly run catches new HA releases and betas before Dependabot does.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    # Only ruff, at the version pinned in the dev group: no HA needed.
    - name: Install ruff
      run: |
        pip install "$(python -c 'import tomllib; print(next(d for d in tomllib.load(open("pyproject.toml", "rb"))["dependency-groups"]["dev"] if d.startswith("ruff")))')"

    - name: Lint with ruff
      run: |
        ruff check .

  test:
    name: test (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    # latest/beta report breakage without blocking merges.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        ha: [pinned, min, latest, beta]
        include:
          - experimental: false
          - ha: latest
            experimental: true
          - ha: beta
            experimental: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install --group dev
        case "${{ matrix.ha }}" in
          min) pip install "homeassistant==$(jq -r .homeassistant hacs.json)" ;;
          latest) pip install --upgrade homeassistant ;;
          beta) pip install --upgrade --pre homeassistant ;;
        esac
        pip show homeassistant | grep ^Version

    # mypy and pytest run independently: one failing must not hide the other.
    - name: Type check with mypy
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        mypy .

    - name: Run tests with pytest
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pytest -v
